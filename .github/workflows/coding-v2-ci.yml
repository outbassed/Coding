name: Coding 2.0 foundation
on:
  push:
    branches: [coding-v2]
  pull_request:
    paths: ['coding-v2/**', '.github/workflows/coding-v2-ci.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coding-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Fase de transição: o package-lock.json ainda não existe, então instalamos e o exportamos.
      - run: npm install --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: coding-v2/package-lock.json
      - run: npm run test:structure
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: coding-v2/test-results
          if-no-files-found: ignore
