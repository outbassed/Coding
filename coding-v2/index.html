<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coding Launcher</title>
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff">
<!-- Sem JavaScript: o navegador segue direto para o Launcher. -->
<noscript><meta http-equiv="refresh" content="0;url=/launcher/"></noscript>
<script>(function(){try{var t=localStorage.getItem('coding-v2-theme');var d=document.documentElement;if(t==='light'||t==='dark')d.setAttribute('data-theme',t);var dark=t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dark?'#171c24':'#ffffff');if(localStorage.getItem('coding-v2-motion')==='reduce')d.setAttribute('data-motion','reduce')}catch(e){}})()</script>
<style>
/* Tela de abertura: não depende do Vue nem de arquivos externos além do logo; as cores seguem o tema salvo, sem flash branco no escuro. */
:root{--bg:#f3f5f9;--fg:#151b27;--muted:#4a566b;--accent:#2f5fd0;--track:#d3dae6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c24;--fg:#eef2f8;--muted:#aab4c5;--accent:#8fb0ff;--track:#2c3546;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c24;--fg:#eef2f8;--muted:#aab4c5;--accent:#8fb0ff;--track:#2c3546;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.splash{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{width:96px;height:96px;display:block;border-radius:24px;box-shadow:0 10px 30px rgb(20 30 58 / 18%)}
h1{margin:6px 0 0;font-size:1.6rem;line-height:1.2;font-weight:700}
.msg{margin:0;font-size:1rem;color:var(--muted)}
.bar{width:132px;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.bar i{display:block;width:40%;height:100%;border-radius:4px;background:var(--accent);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
.open{margin-top:6px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center}
.open:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.55}}
:root[data-motion="reduce"] .bar i{animation:none;width:100%;opacity:.55}
</style></head>
<body><main><div class="splash" role="status" aria-live="polite" data-testid="splash">
<img class="logo" src="/legacy-icons/coding.svg" width="96" height="96" alt="">
<h1>Coding Launcher</h1>
<p class="msg">Abrindo o Launcher...</p>
<div class="bar" aria-hidden="true"><i></i></div>
<a class="open" href="/launcher/" data-testid="splash-open">Abrir o Coding Launcher</a>
</div></main>
<!-- Depois de pintar a tela de abertura, segue direto para o Launcher, sem espera artificial. Ele decide se retoma a última sessão (veja shared/navMemory.ts). -->
<script>try{location.replace('/launcher/')}catch(e){}</script></body></html>
